<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminder App</title>
</head>
<body>
    <div class="container">
<h1 id="header">Reminder App</h1>
<br><br>
<div class="divs"><label for="title">Title</label>
<input type="text" id="title" placeholder="Title"></div>
<br>
<div class="divs"><label for="priority">Priority (1-5): </label>
<input type="text" id="priority" placeholder="Priority"></div>
<br>
<div class="divs"><label for="color">Color: </label>
<input type="color" id="color" placeholder="Color"></div>
<br>
<div class="divs"><label for="description">Description: </label>
<input type="text" id="description" placeholder="Description"></div>
<br>
<button id="addReminder">Add Reminder</button>
<button id="showReminders">Show Reminders</button>
</div>
<table id="remindersTable"></table>

    <script src="reminder.js"></script>
    <link rel="stylesheet" href="style.css">
</body>
</html>
