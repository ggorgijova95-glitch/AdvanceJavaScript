<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body class="container mt-5">
 
  <div id="navbar">
  <div class="navbar-left">
    <a class="btn btn-light nav-item" href="#">Home</a>
    <a class="btn btn-light nav-item" href="#">Cars</a>
    <a class="btn btn-light nav-item" href="#">Filter Cars</a>
  </div>
  <div class="navbar-right">
    <input type="text" id="searchInput" class="form-control" placeholder="Search by brand or type...">
    <button id="searchButton" class="btn btn-primary">Search</button>
  </div>
</div>
<!--pages-->
<div id="pages">

  <!-- Home Page -->
  <div class="page">
    <h1 class="title">Car Workshop</h1>
    <p class="paragraph">Welcome to our car workshop...</p>
  </div>

  <!-- Cars Page (Table) -->
  <div class="page" style="display:none;">
    <h1 class="title">Cars</h1>
    <p class="paragraph">Here are the cars in our inventory:</p>
    <p id="wrongInputMessage" style="display:none; color: red;">Please enter a valid search term.</p>
    <table class="table table-striped table-bordered" style="display:none;" id="carsTable">
      <thead class="table-dark">
        <tr>
          <th>Type</th>
          <th>Brand</th>
          <th>Model</th>
          <th>Doors</th>
          <th>Gas Type</th>
          <th>Color</th>
          <th>New</th>
          <th>Horsepower</th>
        </tr>
      </thead>
      <tbody id="userTable"></tbody>
    </table>
  </div>

  <!-- Filter Cars Page (Cards + Loader) -->
  <div class="page" style="display:none;">
    <h1 class="title">Filter Cars</h1>
    <form id="filters">
      <label>Brand: <input type="text" id="brand"></label><br>
      <label>Model: <input type="text" id="model"></label><br>
      <label>Doors: <input type="number" id="doors"></label><br>
      <label>Gas Type:
        <select id="gasType">
          <option value="">Any</option>
          <option value="Petrol">Petrol</option>
          <option value="Diesel">Diesel</option>
          <option value="Electric">Electric</option>
        </select>
      </label><br>
      <label>Color: <input type="text" id="color"></label><br>
      <label>Condition:
        <input type="radio" name="condition" value="" checked> Any
        <input type="radio" name="condition" value="new"> New
        <input type="radio" name="condition" value="old"> Old
      </label><br>
      <label>Horsepower Min: <input type="number" id="hpMin"></label>
      <label>Horsepower Max: <input type="number" id="hpMax"></label><br>
      <button type="button" id="applyFiltersButton">Apply Filters</button>
    </form>

    <div id="loader" style="display:none;">
      <div class="spinner"></div>
    </div>
    <div id="filterCarsContainer" class="cards-container"></div>
  </div>
</div>
<script src = "script.js"></script>
<link rel = "stylesheet" href = "style.css">
</body>
</html>
